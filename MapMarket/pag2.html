        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function renderizarProdutos() {
            const container = document.getElementById("produtos");
            const termoBusca = normalizarTexto(document.getElementById("pesquisa").value.trim());
            const setorSelecionado = document.getElementById("setor").value;
            container.innerHTML = "";

            const filtrados = listaProdutos.filter(p =>
                normalizarTexto(p.nome).includes(termoBusca) &&
                (setorSelecionado === "Todos" || p.categoria === setorSelecionado)
            );

            if (filtrados.length === 0) {
                container.innerHTML = '<p class="sem-resultados">Nenhum produto encontrado.</p>';
                return;
            }

            const categorias = [...new Set(filtrados.map(p => p.categoria))];

            categorias.forEach(cat => {
                const itens = filtrados.filter(p => p.categoria === cat);
                const secao = document.createElement("section");
                secao.className = "secao-categoria";
                secao.id = "cat-" + normalizarTexto(cat);

                secao.innerHTML = `
                    <div class="titulo-categoria">
                        <h2>${cat}</h2>
                        <span>${itens.length} itens</span>
                    </div>
                    <div class="fileira-produtos">
                        ${itens.map(p => `
                            <div class="card-produto">
                                <span class="badge-estoque ${p.estoque ? 'disponivel' : 'esgotado'}">
                                    ${p.estoque ? '● Em estoque' : '● Indisponível'}
                                </span>
                                <img src="${p.imagem}" alt="${p.nome}">
                                <div class="info-produto">
                                    <span class="corredor-tag">${p.corredor}</span>
                                    <h3>${p.nome}</h3>
                                    <p class="preco">${p.preco}</p>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                `;
                container.appendChild(secao);
            });
        }

        const inputTopo = document.getElementById("pesquisaTopo");
        const botaoTopo = document.getElementById("btnPesquisaTopo");
        inputTopo.addEventListener("input", function() {
        document.getElementById("pesquisa").value = inputTopo.value.trim();
        document.getElementById("setor").value = "Todos";
        renderizarProdutos();
        });


        function executarBuscaTopo() {
            document.getElementById("pesquisa").value = inputTopo.value.trim();
            document.getElementById("setor").value = "Todos";
            renderizarProdutos();
            document.getElementById("produtos").scrollIntoView({ behavior: "smooth" });
        }

        botaoTopo.addEventListener("click", executarBuscaTopo);
        inputTopo.addEventListener("keypress", e => { if (e.key === "Enter") { e.preventDefault(); executarBuscaTopo(); } });
        
        document.getElementById("pesquisa").addEventListener("input", renderizarProdutos);
        document.getElementById("setor").addEventListener("change", renderizarProdutos);

        document.querySelectorAll("#listaCategorias a").forEach(link => {
            link.addEventListener("click", e => {
                e.preventDefault();
                document.getElementById("setor").value = "Todos";
                document.getElementById("pesquisa").value = "";
                inputTopo.value = "";
                renderizarProdutos();
                document.getElementById("listaCategorias").classList.remove("ativo");

                const alvo = document.getElementById("cat-" + normalizarTexto(link.textContent.trim()));
                if (alvo) alvo.scrollIntoView({ behavior: "smooth" });
            });
        });

        renderizarProdutos();

        let slideAtual = 0;
        const slides = document.querySelector(".slides");
        const imagens = document.querySelectorAll(".slides img");
        const indicadores = document.querySelectorAll(".indicadores span");

        function atualizarSlide() {
            slides.style.transform = `translateX(-${slideAtual * 100}%)`;
            indicadores.forEach((b, i) => b.classList.toggle("ativo", i === slideAtual));
        }

        function mudarSlide(dir) {
            slideAtual = (slideAtual + dir + imagens.length) % imagens.length;
            atualizarSlide();
        }

        function irParaSlide(i) {
            slideAtual = i;
            atualizarSlide();
        }

        setInterval(() => mudarSlide(1), 4000);
        atualizarSlide();

        function abrirCategorias() {
            document.getElementById("listaCategorias").classList.toggle("ativo");
        }
    </script>
